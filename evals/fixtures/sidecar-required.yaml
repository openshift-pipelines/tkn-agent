apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: local-sidecar-required
spec:
  pipelineSpec:
    tasks:
      - name: service-check
        taskSpec:
          sidecars:
            - name: service
              image: docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
              command: [sh, -c]
              args:
                - mkdir -p /srv; printf 'ready\n' > /srv/index.html; exec httpd -f -p 8080 -h /srv
          steps:
            - name: query
              image: docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
              script: |
                #!/bin/sh
                set -eu
                wget -qO- http://127.0.0.1:8080 | grep -qx ready
