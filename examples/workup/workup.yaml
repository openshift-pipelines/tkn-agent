version: 1
# Replace this with an absolute path in your checkout.
skills:
  - path: /absolute/path/to/tkn-agent/examples/workup/skills/build-failure/SKILL.md
    required_tools: [evidence_get_kubernetes_resource, evidence_get_pipelinerun_logs, inspect_pipeline]
mcp_servers:
  - name: evidence
    transport: streamable_http
    url: http://127.0.0.1:18080/mcp
    bearer_token_env: WORKUP_MCP_TOKEN
    tools: [get_kubernetes_resource, get_pipelinerun_logs]
pipelines:
  - name: inspect-build-state
    params:
      target:
        type: string
        required: true
        pattern: '^workup-(failed|control)-build-[a-z0-9]+$'
        max_length: 128
    required_results: [evidence]
  - name: inspect-build-inputs
    params:
      target:
        type: string
        required: true
        pattern: '^workup-(failed|control)-build-[a-z0-9]+$'
        max_length: 128
      control:
        type: string
        required: true
        pattern: '^workup-control-build-[a-z0-9]+$'
        max_length: 128
    required_results: [evidence, control-evidence]
execution:
  service_account: workup-reader
limits:
  max_model_calls: 12
  max_tool_calls: 24
  max_runs: 3
  timeout_seconds: 540
  max_evidence_bytes: 65536
