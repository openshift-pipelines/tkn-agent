apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: mixed-local-and-cluster-checks
spec:
  pipelineSpec:
    workspaces:
      - name: source
    tasks:
      - name: lint
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: check
              image: docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                grep -qx valid message.txt
                printf 'local check passed\n'
      - name: image
        taskSpec:
          steps:
            - name: build
              image: docker.io/library/alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
              script: |
                #!/bin/sh
                printf 'HEAVY_TASK_EXECUTED\n'
                buildah bud -t example.invalid/application .
  workspaces:
    - name: source
      emptyDir: {}
